service_name: auto-augment-pipeline

providers:
  mock_vision:
    kind: mock
    role: multimodal
    model: mock-vision

  nano_banana2_pro:
    kind: openai_compatible
    role: image_edit
    base_url: ${NANO_BANANA_BASE_URL}
    api_key: ${NANO_BANANA_API_KEY}
    model: ${NANO_BANANA_MODEL}
    timeout_seconds: 120
    extra:
      response_format: b64_json

  qwen_vl:
    kind: dashscope_multimodal
    role: multimodal
    base_url: ${QWEN_BASE_URL}
    api_key: ${QWEN_API_KEY}
    model: ${QWEN_MODEL}
    timeout_seconds: 60
    temperature: 0.0
    max_tokens: 1024

pipelines:
  vision_label_bundle:
    name: vision_label_bundle
    display_name: 图像理解 + BBox 草稿
    description: Use the same input image to produce a scene summary and an annotation draft.
    pipeline_type: assist_annotation
    enabled: true
    supported_annotation_types: [0]
    supported_shapes: [bbox]
    steps:
      - name: describe_scene
        capability: describe_image
        provider: qwen_vl
        input_key: input
        output_key: scene_description
      - name: draft_boxes
        capability: draft_annotation
        provider: qwen_vl
        input_key: input
        output_key: draft_annotations
        params:
          json_mode: true
          json_response_type: json_object
          class_match_score: 0.72
          score_threshold: 0.2

  direct_bbox_preview:
    name: direct_bbox_preview
    display_name: 直接理解 BBox + 预览图
    description: Ask a multimodal model to directly return bbox JSON, then render an annotated preview image with OpenCV and upload it to S3.
    pipeline_type: assist_annotation
    enabled: true
    supported_annotation_types: [0]
    supported_shapes: [bbox]
    steps:
      - name: direct_bbox_preview
        capability: draft_annotation_preview
        provider: qwen_vl
        input_key: input
        output_key: draft_annotations
        params:
          class_match_score: 0.72
          score_threshold: 0.2

  overlay_extract:
    name: overlay_extract
    display_name: 白框图提取 BBox
    description: Extract white boxes from an overlay image and assign OCR text to the nearest box.
    pipeline_type: assist_annotation
    enabled: true
    supported_annotation_types: [0]
    supported_shapes: [bbox]
    steps:
      - name: extract_overlay
        capability: extract_white_annotations
        input_key: input
        output_key: overlay_annotations
        params:
          infer_labels: true
          class_match_score: 0.6
          min_area: 250

  overlay_understand_mllm:
    name: overlay_understand_mllm
    display_name: 多模态理解白框 BBox
    description: Let a multimodal model recover structured labels from a white-box overlay image.
    pipeline_type: assist_annotation
    enabled: true
    supported_annotation_types: [0]
    supported_shapes: [bbox]
    steps:
      - name: understand_overlay
        capability: understand_white_annotations
        provider: qwen_vl
        input_key: input
        output_key: overlay_annotations
        params:
          json_mode: true
          json_response_type: json_object
          class_match_score: 0.72

  render_then_extract_overlay:
    name: render_then_extract_overlay
    display_name: 生成白框并提取 BBox
    description: Use an image editing model to render pure white overlays, then extract them with OpenCV and OCR.
    pipeline_type: assist_annotation
    enabled: true
    supported_annotation_types: [0]
    supported_shapes: [bbox]
    steps:
      - name: render_overlay
        capability: render_white_annotation_overlay
        provider: nano_banana2_pro
        input_key: input
        output_key: overlay_result
      - name: extract_overlay
        capability: extract_white_annotations
        input_key: input
        output_key: overlay_annotations
        context_mapping:
          overlay_image: overlay_result.overlay_image
        params:
          infer_labels: true
          class_match_score: 0.6
          min_area: 250
