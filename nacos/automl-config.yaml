# Auto ML Platform Configuration

# 数据库配置（主服务使用）
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/auto_ml?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: automl
    password: automl123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      max-lifetime: 1800000

# S3/MinIO 配置
local-s3-config:
  access_key: ${ACCESS_KEY}
  secret_key: ${SECRET_KEY}
  endpoint: http://minio:9000
  bucket_name: auto-ml-datasets
  datasets_bucket_name: auto-ml-datasets
  models_bucket_name: auto-ml-models
  augment_bucket_name: auto-ml-augment

# RabbitMQ 配置
rabbitmq:
  host: rabbitmq
  port: 5672
  username: automl
  password: automl123456
  virtual_host: /
  exchange_name: auto_ml_exchange
  exchange_type: topic
  # 队列定义
  queues:
    task_status: auto_ml.task.status
    task_log: auto_ml.task.log
    model_registered: auto_ml.model.registered
    model_deployed: auto_ml.model.deployed
    trainer_task: trainer.task.queue

# 模型训练服务配置
model-trainer:
  default_device: cpu
  max_concurrent_tasks: 1
  temp_dir: /app/runs

# 模型部署服务配置
model-deploy:
  runtime_base_port: 9001
  runtime_max_port: 9100
  model_cache_dir: /app/models
  health_check_interval: 30

# 日志配置
logging:
  level: INFO
  path: /app/logs
